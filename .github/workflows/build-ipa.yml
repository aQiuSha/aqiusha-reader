name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List files
        run: |
          ls -la
          echo "---"
          ls -la *.xcodeproj/
          echo "---"
          ls -la 阿邱鲨/

      - name: Build for testing (unsigned)
        run: |
          xcodebuild \
            -project *.xcodeproj \
            -scheme 阿邱鲨 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_GENERATE_PROVISIONING_PROFILE=NO \
            build 2>&1 | tail -100

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r app.ipa Payload
          mv app.ipa ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqiusha-ipa
          path: app.ipa
          retention-days: 30