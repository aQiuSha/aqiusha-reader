name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for testing (unsigned)
        run: |
          xcodebuild \
            -project *.xcodeproj \
            -scheme 阿邱鲨 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_GENERATE_PROVISIONING_PROFILE=NO \
            build

      - name: Find and create IPA
        run: |
          echo "Build products:"
          ls -la build/Build/Products/Release-iphoneos/
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r app.ipa Payload
          mv app.ipa ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqiusha-ipa
          path: app.ipa
          retention-days: 30