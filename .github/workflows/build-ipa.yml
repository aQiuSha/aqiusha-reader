name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing (unsigned)
        run: |
          xcodebuild \
            -project AQiuSha.xcodeproj \
            -scheme AQiuSha \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_GENERATE_PROVISIONING_PROFILE=NO \
            build 2>&1 | tee build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/AQiuSha.app build/Payload/
          cd build
          zip -r 阿邱鲨-unsigned.ipa Payload
          mv 阿邱鲨-unsigned.ipa ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 阿邱鲨-ipa
          path: 阿邱鲨-unsigned.ipa
          retention-days: 30
