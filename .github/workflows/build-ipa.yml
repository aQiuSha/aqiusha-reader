name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List schemes and save output
        run: |
          xcodebuild -list -project *.xcodeproj > schemes.txt 2>&1
          cat schemes.txt

      - name: Upload schemes output
        uses: actions/upload-artifact@v4
        with:
          name: schemes-output
          path: schemes.txt
          retention-days: 1