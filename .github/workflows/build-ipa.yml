name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create new Xcode project
        run: |
          # 创建新的iOS app工程
          mkdir -p build
          cd build
          xcrun xcodebuild \
            -project ..\阿邱鲨.xcodeproj \
            -list 2>&1 | head -20

      - name: Try building with target
        run: |
          xcodebuild \
            -project *.xcodeproj \
            -target 阿邱鲨 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -30